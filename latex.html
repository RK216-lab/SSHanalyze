<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaTeX v5 - 数式画像ジェネレーター</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root{--bg:#f5f5f7;--sf:#fff;--sf2:#fafafc;--ink:#111;--mut:#6e6e73;--acc:#0071e3;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);--r:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.04),0 8px 24px -6px rgba(0,0,0,.08);--sp:clamp(1rem,.8rem + .8vw,1.4rem)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
header{background:var(--sf);border-bottom:1px solid var(--line);padding:.9rem var(--sp);position:sticky;top:0;z-index:10}
.header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
h1{font-size:1.1rem;font-weight:600}
.sub{font-size:.78rem;color:var(--mut)}
main{max-width:1180px;margin:0 auto;padding:var(--sp);display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--sf);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:.9rem 1.1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.pt{font-size:.9rem;font-weight:600}
.pb{padding:1.1rem;flex:1;display:flex;flex-direction:column;gap:1rem}
label{font-size:.78rem;font-weight:500;color:var(--mut);display:block;margin-bottom:.28rem}
textarea,input,select{width:100%;font:inherit;font-size:.92rem;padding:.6rem .8rem;border:1px solid var(--line2);border-radius:var(--rs);background:var(--sf2);color:var(--ink);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
textarea{resize:vertical;min-height:88px;line-height:1.5;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.pw{flex:1;min-height:260px;border:2px dashed var(--line2);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;padding:1.2rem;position:relative;overflow:auto;background:#fff}
.pw.has{background:#fff repeating-conic-gradient(#f6f6f6 0 25%,#fff 0 50%) 0 / 20px 20px;border-style:solid;border-color:var(--line)}
#preview{max-width:100%}
.phold{color:var(--mut);font-size:.88rem;text-align:center}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.65rem}
.cg{display:flex;flex-direction:column;gap:.18rem}
.cg.inline{flex-direction:row;align-items:center;gap:.38rem}
.cg.inline label{margin:0;white-space:nowrap}
input[type=color]{width:100%;height:32px;border:1px solid var(--line2);border-radius:var(--rs);padding:2px}
input[type=range]{width:100%}
input[type=checkbox]{width:auto}
.rv{font-size:.74rem;color:var(--mut);text-align:right;min-width:3em;float:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;padding:.48rem .85rem;font-size:.8rem;font-weight:500;border-radius:var(--rs);border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-s{background:var(--sf);color:var(--ink);border-color:var(--line2)}
.br{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(12px);background:#111;color:#fff;padding:.55rem .95rem;border-radius:8px;font-size:.8rem;opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#ff3b30}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;background:var(--sf2);border:1px solid var(--line);border-radius:8px;padding:.55rem;max-height:110px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--mut)}
.mode{display:flex;background:var(--sf2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;width:fit-content}
.mbtn{padding:.34rem .85rem;border-radius:999px;border:0;background:transparent;font-size:.8rem;font-weight:500;cursor:pointer;color:var(--mut);font-family:inherit}
.mbtn.on{background:var(--sf);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--ink);border:1px solid var(--line)}
.div{height:1px;background:var(--line);margin:.15rem 0}
.hint{font-size:.72rem;color:var(--mut)}
.errbox{background:#fff0f0;border:1px solid #ffcccc;color:#c00;padding:.6rem;border-radius:8px;font-size:.78rem;white-space:pre-wrap;display:none}
.tex-err{color:#ff3b30;font-family:ui-monospace,Menlo,monospace;font-size:.85em}
/* 出力用 */
.figure-card{display:inline-block;text-align:left;line-height:1.2}
.figure-formula{line-height:1.28}
.figure-legend{margin-top:.7em;line-height:1.55;display:grid;grid-template-columns:auto auto 1fr;column-gap:.4em;row-gap:.16em;align-items:baseline}
.legend-full{grid-column:1/-1}
.legend-colon{opacity:.6}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>LaTeX v5 <span style="font-weight:400;color:var(--mut);font-size:.75em">数式画像ジェネレーター</span></h1>
      <div class="sub">式(大)＋凡例(小) | 透過PNG / SVG / JPG | 余白トリム | 設定は自動保存</div>
    </div>
    <div class="br"><span style="font-size:.7rem;color:var(--mut)" id="katexState">KaTeX読込中...</span></div>
  </div>
</header>

<main>
  <!-- 入力パネル -->
  <div class="panel">
    <div class="ph">
      <div class="pt">入力</div>
      <div class="mode">
        <button class="mbtn on" data-mode="single">単一式</button>
        <button class="mbtn" data-mode="figure">式＋凡例</button>
      </div>
    </div>
    <div class="pb">
      <div id="singlePane">
        <label>LaTeX 数式</label>
        <textarea id="latexInput" spellcheck="false">E = mc^2</textarea>
      </div>

      <div id="figurePane" style="display:none;flex-direction:column;gap:1rem">
        <div>
          <label>上の式（大きく）LaTeX</label>
          <textarea id="formulaInput" style="min-height:78px" spellcheck="false"></textarea>
        </div>
        <div>
          <label>下の凡例（1行1項目、「記号 : 説明」の形式）</label>
          <textarea id="legendInput" style="min-height:108px" spellcheck="false"></textarea>
          <div class="hint">記号部分はLaTeX可。コロンがない行は全幅で表示されます。</div>
        </div>
        <div class="controls">
          <div class="cg"><label>式サイズ <span class="rv" id="fsVal"></span></label><input type="range" id="fs" min="16" max="52" step="1" value="28"></div>
          <div class="cg"><label>凡例サイズ <span class="rv" id="lsVal"></span></label><input type="range" id="ls" min="9" max="22" step="1" value="13"></div>
        </div>
      </div>

      <div>
        <label>プリセット</label>
        <div class="br">
          <select id="preset" style="flex:1"></select>
          <button class="btn btn-s" id="loadPresetBtn">読み込み</button>
        </div>
      </div>

      <div class="div"></div>

      <div class="controls">
        <div class="cg"><label>文字色</label><input type="color" id="tc" value="#000000"></div>
        <div class="cg"><label>背景色</label><input type="color" id="bg" value="#ffffff"></div>
        <div class="cg inline" style="align-self:end"><input type="checkbox" id="tr" checked><label for="tr">背景透過</label></div>
        <div class="cg inline" style="align-self:end"><input type="checkbox" id="trim" checked><label for="trim">余白トリム</label></div>
        <div class="cg"><label>余白 <span class="rv" id="padVal"></span></label><input type="range" id="pad" min="0" max="48" step="2" value="16"></div>
        <div class="cg"><label>拡大率 <span class="rv" id="scVal"></span></label><input type="range" id="sc" min="1" max="4" step="0.25" value="2"></div>
        <div class="cg"><label>DPI（メタ情報）</label><input type="number" id="dpi" value="300" min="72" max="600" step="10"></div>
        <div class="cg"><label>形式</label>
          <select id="fmt"><option value="png">PNG（透過可）</option><option value="svg">SVG</option><option value="jpg">JPG</option></select>
        </div>
        <div class="cg" style="grid-column:1/-1"><label>ファイル名</label><input type="text" id="fname" value="latex"></div>
      </div>

      <div class="br">
        <button class="btn btn-s" id="clearBtn">クリア</button>
        <button class="btn btn-s" id="copyTexBtn">LaTeXをコピー</button>
      </div>
    </div>
  </div>

  <!-- プレビューパネル -->
  <div class="panel">
    <div class="ph">
      <div class="pt">プレビュー <span id="status" style="font-weight:400;color:var(--mut);font-size:.76em;margin-left:.4em"></span></div>
      <div class="br"><button class="btn btn-p" id="renderBtn">レンダリング</button></div>
    </div>
    <div class="pb">
      <div class="pw" id="pw">
        <div class="phold" id="phold">LaTeXを入力すると自動でプレビューされます</div>
        <div id="preview" style="display:none"></div>
      </div>
      <div class="br">
        <button class="btn btn-p" id="dlBtn" disabled>ダウンロード</button>
        <button class="btn btn-s" id="copyImgBtn" disabled>画像コピー</button>
        <button class="btn btn-s" id="copySvgBtn" disabled>SVGコードコピー</button>
      </div>
      <div id="svgWrap" style="display:none"><label>SVGコード</label><pre class="code" id="svgCode"></pre></div>
      <div id="errBox" class="errbox"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ========= 状態 ========= */
let lastSvgXml='', lastSvgBlobUrl=null, lastPngUrl=null, lastJpgUrl=null;
let katexCssFull='', katexCssLite='';
let mode='single', rendering=false, pending=false;
const STORE_KEY='latex_v5_settings';

const $=id=>document.getElementById(id);
const latexInput=$('latexInput'), formulaInput=$('formulaInput'), legendInput=$('legendInput');
const preview=$('preview'), pw=$('pw'), phold=$('phold');
const toastEl=$('toast'), svgWrap=$('svgWrap'), svgCodeEl=$('svgCode'), errBox=$('errBox');
const tc=$('tc'), bg=$('bg'), tr=$('tr'), trim=$('trim'), pad=$('pad'), sc=$('sc'), dpi=$('dpi'), fmt=$('fmt'), fname=$('fname');
const fs=$('fs'), ls=$('ls');
const statusEl=$('status'), katexState=$('katexState');
const dlBtn=$('dlBtn'), copyImgBtn=$('copyImgBtn'), copySvgBtn=$('copySvgBtn'), renderBtn=$('renderBtn');
const presetSel=$('preset');
const presetSelection={single:null,figure:null};

/* ========= プリセット（String.raw で \ をそのまま扱う） ========= */
const RAW=String.raw;
const PRESETS=[
  {name:'E = mc²（単一式）', mode:'single', tex:RAW`E = mc^2`},
  {name:'二次方程式の解の公式', mode:'single', tex:RAW`x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}`},
  {name:'ガウス積分', mode:'single', tex:RAW`\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}`},
  {name:'Rate式（式＋凡例）', mode:'figure',
    formula:RAW`\text{Rate} = \frac{W_{\text{before}} - W_{\text{after}}}{W_{\text{before}} - W_{\text{base}}} \times 100\ (\%)`,
    legend:RAW`W_{\text{base}} : Base fabric weight
W_{\text{before}} : Weight before washing
W_{\text{after}} : Weight after washing`},
  {name:'ベイズの定理（式＋凡例）', mode:'figure',
    formula:RAW`P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}`,
    legend:RAW`P(A \mid B) : Posterior probability
P(B \mid A) : Likelihood
P(A) : Prior probability
P(B) : Marginal likelihood`}
];

/* ========= ユーティリティ ========= */
function toast(m,err){toastEl.textContent=m;toastEl.classList.toggle('err',!!err);toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),2200);}
function escHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function strip(s){const v=s.trim();if(v.startsWith('$$')&&v.endsWith('$$'))return v.slice(2,-2).trim();if(v.startsWith('$')&&v.endsWith('$'))return v.slice(1,-1).trim();return v;}
function ts(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
function setOutputsEnabled(on){if(!on){dlBtn.disabled=true;copyImgBtn.disabled=true;copySvgBtn.disabled=true;return;}syncOutputButtons();}
function syncOutputButtons(){
  const hasSvg=!!lastSvgXml, hasPng=!!lastPngUrl, hasJpg=!!lastJpgUrl;
  copySvgBtn.disabled=!hasSvg;
  if(fmt.value==='svg'){dlBtn.disabled=!hasSvg;copyImgBtn.disabled=!hasSvg;return;}
  if(fmt.value==='png'){dlBtn.disabled=!(hasPng||hasSvg);copyImgBtn.disabled=!hasPng;return;}
  dlBtn.disabled=!(hasJpg||hasSvg);copyImgBtn.disabled=!hasJpg;
}

/* ========= KaTeX CSS 読み込み ========= */
async function loadKatexCss(){
  try{
    const r=await fetch('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',{cache:'force-cache'});
    if(r.ok){
      let txt=await r.text();
      txt=txt.replace(/url\(["']?fonts\//g,"url('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/fonts/");
      katexCssFull=txt;
      katexCssLite=txt.replace(/@font-face\s*{[^}]*}/g,'')+`.katex{font-family:"Times New Roman",Times,serif !important;}`;
    }
  }catch(e){console.warn(e);}
  katexState.textContent=typeof katex!=='undefined'?'KaTeX OK':'KaTeX未読込';
}

/* ========= モード切替 ========= */
function setMode(m){
  mode=m;
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('singlePane').style.display=m==='single'?'block':'none';
  $('figurePane').style.display=m==='figure'?'flex':'none';
  updatePresetOptions();
  scheduleRender();
}
function updatePresetOptions(){
  const current=parseInt(presetSel.value,10);
  if(Number.isInteger(current)&&PRESETS[current]?.mode===mode)presetSelection[mode]=current;
  presetSel.innerHTML='';
  let first=null;
  PRESETS.forEach((p,i)=>{
    if(p.mode!==mode)return;
    if(first===null)first=i;
    const o=document.createElement('option');o.value=i;o.textContent=p.name;presetSel.appendChild(o);
  });
  const preferred=(Number.isInteger(presetSelection[mode])&&PRESETS[presetSelection[mode]]?.mode===mode)?presetSelection[mode]:first;
  if(preferred!==null){presetSel.value=String(preferred);presetSelection[mode]=preferred;}
}

/* ========= 凡例パース ========= */
function parseLegend(txt){
  return txt.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const mm=line.match(/^(.+?)\s*[:：]\s*(.+)$/);
    return mm?{sym:mm[1].trim(),desc:mm[2].trim()}:{sym:'',desc:line};
  });
}

/* ========= KaTeX描画（エラーは戻り値で返す） ========= */
function renderKatex(tex,el,display){
  try{
    katex.render(strip(tex),el,{throwOnError:true,displayMode:!!display,trust:false,strict:'ignore'});
    return null;
  }catch(e){
    el.innerHTML='';
    const s=document.createElement('span');s.className='tex-err';s.textContent=tex;el.appendChild(s);
    return e.message;
  }
}

/* ========= レンダリング（取りこぼしなし） ========= */
function scheduleRender(){clearTimeout(scheduleRender._t);scheduleRender._t=setTimeout(render,300);}
async function render(){
  if(typeof katex==='undefined'){
    katexState.textContent='KaTeX未読込';
    statusEl.textContent='失敗';
    errBox.textContent='KaTeXの読み込みに失敗しました。ページを再読み込みしてください。';
    errBox.style.display='block';
    setOutputsEnabled(false);
    return;
  }
  if(rendering){pending=true;return;}
  rendering=true;
  try{
    do{pending=false;await doRender();}while(pending);
  }finally{rendering=false;}
}
async function doRender(){
  const textColor=tc.value, bgColor=tr.checked?'transparent':bg.value, padV=parseInt(pad.value,10)||0;
  katexState.textContent='KaTeX OK';
  renderBtn.disabled=true;
  statusEl.textContent='レンダリング中...';
  errBox.style.display='none';
  const errors=[];
  try{
    preview.innerHTML='';
    preview.style.color=textColor;
    preview.style.background=bgColor;
    preview.style.padding=padV+'px';

    const hasContent=mode==='single'?latexInput.value.trim():(formulaInput.value.trim()||legendInput.value.trim());
    if(!hasContent){
      preview.style.display='none';phold.style.display='block';pw.classList.remove('has');
      statusEl.textContent='';setOutputsEnabled(false);
      lastSvgXml='';lastPngUrl=lastJpgUrl=null;
      if(lastSvgBlobUrl){URL.revokeObjectURL(lastSvgBlobUrl);lastSvgBlobUrl=null;}
      svgCodeEl.textContent='';svgWrap.style.display='none';
      return;
    }
    preview.style.display='block';phold.style.display='none';pw.classList.add('has');

    if(mode==='single'){
      const inner=document.createElement('div');inner.style.display='inline-block';
      preview.appendChild(inner);
      const err=renderKatex(latexInput.value,inner,true);
      if(err)errors.push('式: '+err);
    }else{
      const card=document.createElement('div');card.className='figure-card';
      const fDiv=document.createElement('div');fDiv.className='figure-formula';
      fDiv.style.fontSize=fs.value+'px';fDiv.style.color=textColor;
      const fInner=document.createElement('div');fInner.style.display='inline-block';
      fDiv.appendChild(fInner);
      const fRaw=formulaInput.value.trim();
      if(fRaw){const err=renderKatex(fRaw,fInner,true);if(err)errors.push('上の式: '+err);}
      card.appendChild(fDiv);

      const lRaw=legendInput.value.trim();
      if(lRaw){
        const legDiv=document.createElement('div');legDiv.className='figure-legend';
        legDiv.style.fontSize=ls.value+'px';legDiv.style.color=textColor;
        parseLegend(lRaw).forEach(it=>{
          if(it.sym){
            const sym=document.createElement('span');
            if(/[_^\\{}]/.test(it.sym)){const err=renderKatex(it.sym,sym,false);if(err)errors.push('凡例: '+err);}
            else sym.textContent=it.sym;
            const col=document.createElement('span');col.textContent=':';col.className='legend-colon';
            const desc=document.createElement('span');desc.textContent=it.desc;
            legDiv.append(sym,col,desc);
          }else{
            const full=document.createElement('span');full.className='legend-full';full.textContent=it.desc;
            legDiv.appendChild(full);
          }
        });
        card.appendChild(legDiv);
      }
      preview.appendChild(card);
    }

    if(errors.length){errBox.textContent='LaTeXエラー（該当箇所を赤表示）\n'+errors.join('\n');errBox.style.display='block';}

    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    if(document.fonts?.ready){try{await document.fonts.ready;}catch(e){}}
    await generateOutputs();
    saveSettings();
  }catch(e){
    console.error(e);
    errBox.textContent='エラー: '+(e.stack||e.message);errBox.style.display='block';
    statusEl.textContent='失敗';
  }finally{
    renderBtn.disabled=false;
  }
}

/* ========= 出力生成（SVG/PNG/JPG） ========= */
async function generateOutputs(){
  statusEl.textContent='画像生成中...';
  const w=Math.max(1,Math.ceil(preview.scrollWidth));
  const h=Math.max(1,Math.ceil(preview.scrollHeight));
  const textColor=tc.value, bgColor=tr.checked?'transparent':bg.value, padV=parseInt(pad.value,10)||0;
  const innerHtml=preview.innerHTML;
  const wrap=(styleCss,extraFont)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>${styleCss}.figure-card{display:inline-block;text-align:left}.figure-formula{line-height:1.28}.figure-legend{margin-top:.7em;line-height:1.55;display:grid;grid-template-columns:auto auto 1fr;column-gap:.4em;row-gap:.16em;align-items:baseline}.legend-full{grid-column:1/-1}.legend-colon{opacity:.6}</style>${bgColor!=='transparent'?`<rect width="100%" height="100%" fill="${bgColor}"/>`:''}<foreignObject x="0" y="0" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="color:${textColor};padding:${padV}px;width:${w}px;height:${h}px;box-sizing:border-box;background:${bgColor};display:flex;align-items:center;justify-content:center;${extraFont}"><div style="display:inline-block;max-width:100%">${innerHtml}</div></div></foreignObject></svg>`;
  const svgDownload=wrap(katexCssFull,'');
  const svgForPng=wrap(katexCssLite||'',"font-family:'Times New Roman',Times,serif");

  lastSvgXml=svgDownload;
  if(lastSvgBlobUrl)URL.revokeObjectURL(lastSvgBlobUrl);
  lastSvgBlobUrl=URL.createObjectURL(new Blob([svgDownload],{type:'image/svg+xml;charset=utf-8'}));
  svgCodeEl.textContent=svgDownload;svgWrap.style.display='block';
  copySvgBtn.disabled=false;

  try{
    const pngBlobUrl=URL.createObjectURL(new Blob([svgForPng],{type:'image/svg+xml;charset=utf-8'}));
    const res=await svgUrlToCanvas(pngBlobUrl,w,h,bgColor,parseFloat(sc.value),trim.checked);
    URL.revokeObjectURL(pngBlobUrl);
    lastPngUrl=res.png;lastJpgUrl=res.jpg;
    statusEl.textContent=`${w}×${h} → ${res.w}×${res.h}px`;
    setOutputsEnabled(true);
  }catch(e){
    console.error(e);lastPngUrl=null;lastJpgUrl=null;
    statusEl.textContent=`${w}×${h}（PNG失敗・SVGで出力可）`;
    syncOutputButtons();
    errBox.textContent='PNG生成失敗: '+e.message+'\n→ 形式をSVGにするとダウンロードできます。';
    errBox.style.display='block';
  }
}

function svgUrlToCanvas(url,w,h,bgc,scale,doTrim){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const cw=Math.max(1,Math.ceil(w*scale)), ch=Math.max(1,Math.ceil(h*scale));
        const canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        if(bgc&&bgc!=='transparent'){ctx.fillStyle=bgc;ctx.fillRect(0,0,cw,ch);}else ctx.clearRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        const finalCanvas=doTrim?trimCanvas(canvas):canvas;
        const pngUrl=finalCanvas.toDataURL('image/png');
        const c2=document.createElement('canvas');c2.width=finalCanvas.width;c2.height=finalCanvas.height;
        const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c2.width,c2.height);x.drawImage(finalCanvas,0,0);
        resolve({png:pngUrl,jpg:c2.toDataURL('image/jpeg',0.92),w:finalCanvas.width,h:finalCanvas.height});
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error('SVG画像の読み込み失敗'));
    img.src=url;
  });
}

function trimCanvas(canvas){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const w=canvas.width,h=canvas.height;let data;
  try{data=ctx.getImageData(0,0,w,h).data;}catch(e){return canvas;}
  let top=h,left=w,right=-1,bottom=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(data[(y*w+x)*4+3]>10){if(x<left)left=x;if(x>right)right=x;if(y<top)top=y;if(y>bottom)bottom=y;}
  }
  if(right<0)return canvas;
  const p=2;left=Math.max(0,left-p);top=Math.max(0,top-p);right=Math.min(w-1,right+p);bottom=Math.min(h-1,bottom+p);
  const tw=right-left+1,th=bottom-top+1;
  if(tw===w&&th===h)return canvas;
  const out=document.createElement('canvas');out.width=tw;out.height=th;
  out.getContext('2d').drawImage(canvas,left,top,tw,th,0,0,tw,th);
  return out;
}

/* ========= ダウンロード / コピー ========= */
function baseName(){return (fname.value.trim()||'latex').replace(/[\\/:*?"<>|]/g,'_')+'_'+ts();}
function saveBlobUrl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}

function downloadImage(){
  const f=fmt.value;
  if(f==='svg'){
    if(!lastSvgBlobUrl){toast('先にレンダリングしてください',true);return;}
    saveBlobUrl(lastSvgBlobUrl,baseName()+'.svg');toast('SVGをダウンロード');return;
  }
  const url=f==='png'?lastPngUrl:lastJpgUrl;
  if(!url){
    if(lastSvgBlobUrl){toast('PNG失敗のためSVGで保存します',true);saveBlobUrl(lastSvgBlobUrl,baseName()+'.svg');return;}
    toast('先にレンダリングしてください',true);return;
  }
  if(f==='png'){dlWithDpi(url,parseInt(dpi.value,10)||300,baseName()+'.png');return;}
  saveBlobUrl(url,baseName()+'.jpg');toast('JPGをダウンロード');
}

function dlWithDpi(dataUrl,dpiVal,filename){
  try{
    const bin=atob(dataUrl.split(',')[1]);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const ppm=Math.round(dpiVal/0.0254);
    const pHYs=new Uint8Array(9);const dv=new DataView(pHYs.buffer);
    dv.setUint32(0,ppm,false);dv.setUint32(4,ppm,false);pHYs[8]=1;
    const type=new Uint8Array([0x70,0x48,0x59,0x73]);
    const crcSrc=new Uint8Array(type.length+pHYs.length);crcSrc.set(type,0);crcSrc.set(pHYs,type.length);
    const chunk=new Uint8Array(21);const dv2=new DataView(chunk.buffer);
    dv2.setUint32(0,9,false);chunk.set(type,4);chunk.set(pHYs,8);dv2.setUint32(17,crc32(crcSrc),false);
    const ihdrLen=new DataView(bytes.buffer).getUint32(8,false);
    const pos=8+4+4+ihdrLen+4;
    const out=new Uint8Array(bytes.length+chunk.length);
    out.set(bytes.slice(0,pos),0);out.set(chunk,pos);out.set(bytes.slice(pos),pos+chunk.length);
    const url=URL.createObjectURL(new Blob([out],{type:'image/png'}));
    saveBlobUrl(url,filename);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('PNGをダウンロード（'+dpiVal+' DPI）');
  }catch(e){saveBlobUrl(dataUrl,filename);}
}

function crc32(b){
  if(!crc32.table){crc32.table=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);crc32.table[i]=c;}}
  let crc=0xFFFFFFFF;for(let i=0;i<b.length;i++)crc=crc32.table[(crc^b[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}

async function copySvg(){
  if(!lastSvgXml){toast('SVGがありません',true);return;}
  try{await navigator.clipboard.writeText(lastSvgXml);toast('SVGコードをコピー');}
  catch(e){toast('コピー失敗',true);}
}
async function copyImg(){
  const f=fmt.value;
  try{
    if(f==='svg'){
      await navigator.clipboard.write([new ClipboardItem({'image/svg+xml':new Blob([lastSvgXml],{type:'image/svg+xml'})})]);
      toast('SVGをコピー');return;
    }
    const url=f==='png'?lastPngUrl:lastJpgUrl;
    if(!url){toast('先にレンダリングしてください',true);return;}
    const b=await (await fetch(url)).blob();
    await navigator.clipboard.write([new ClipboardItem({[b.type]:b})]);
    toast(f.toUpperCase()+'をコピー');
  }catch(e){toast('コピー失敗: '+e.message,true);}
}
async function copyTex(){
  const t=mode==='single'?latexInput.value:(formulaInput.value+(legendInput.value?'\n\n'+legendInput.value:''));
  try{await navigator.clipboard.writeText(t);toast('LaTeXをコピー');}catch(e){toast('コピー失敗',true);}
}

/* ========= 設定の保存・復元 ========= */
function saveSettings(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify({
      mode,single:latexInput.value,formula:formulaInput.value,legend:legendInput.value,
      presetSingle:presetSelection.single,presetFigure:presetSelection.figure,
      fs:fs.value,ls:ls.value,tc:tc.value,bg:bg.value,tr:tr.checked,trim:trim.checked,
      pad:pad.value,sc:sc.value,dpi:dpi.value,fmt:fmt.value,fname:fname.value
    }));
  }catch(e){}
}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(!s)return false;
    latexInput.value=s.single??latexInput.value;
    formulaInput.value=s.formula??formulaInput.value;
    legendInput.value=s.legend??legendInput.value;
    fs.value=s.fs??fs.value;ls.value=s.ls??ls.value;
    tc.value=s.tc??tc.value;bg.value=s.bg??bg.value;
    tr.checked=s.tr??tr.checked;trim.checked=s.trim??trim.checked;
    pad.value=s.pad??pad.value;sc.value=s.sc??sc.value;
    dpi.value=s.dpi??dpi.value;fmt.value=s.fmt??fmt.value;fname.value=s.fname??fname.value;
    const ps=parseInt(s.presetSingle,10), pf=parseInt(s.presetFigure,10);
    if(Number.isInteger(ps)&&PRESETS[ps]?.mode==='single')presetSelection.single=ps;
    if(Number.isInteger(pf)&&PRESETS[pf]?.mode==='figure')presetSelection.figure=pf;
    return s.mode||false;
  }catch(e){return false;}
}
function updateLabels(){
  $('fsVal').textContent=fs.value+'px';
  $('lsVal').textContent=ls.value+'px';
  $('padVal').textContent=pad.value+'px';
  $('scVal').textContent=parseFloat(sc.value).toFixed(2)+'×';
}

/* ========= イベント ========= */
renderBtn.addEventListener('click',render);
$('clearBtn').addEventListener('click',()=>{
  if(mode==='single')latexInput.value='';else{formulaInput.value='';legendInput.value='';}
  render();
});
$('loadPresetBtn').addEventListener('click',()=>{
  const p=PRESETS[parseInt(presetSel.value,10)];
  if(!p)return;
  presetSelection[mode]=parseInt(presetSel.value,10);
  if(p.mode==='single')latexInput.value=p.tex;
  else{formulaInput.value=p.formula;legendInput.value=p.legend;}
  render();toast('プリセットを読み込みました');
});
$('copyTexBtn').addEventListener('click',copyTex);
document.querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

[latexInput,formulaInput,legendInput].forEach(el=>el.addEventListener('input',scheduleRender));

[fs,ls,pad,sc].forEach(el=>el.addEventListener('input',updateLabels));
[fs,ls,pad,sc,tc,bg,tr,trim,fmt,dpi].forEach(el=>el.addEventListener('change',scheduleRender));
fmt.addEventListener('change',syncOutputButtons);
presetSel.addEventListener('change',()=>{const idx=parseInt(presetSel.value,10);if(Number.isInteger(idx)&&PRESETS[idx]?.mode===mode){presetSelection[mode]=idx;saveSettings();}});
fname.addEventListener('input',saveSettings);

copySvgBtn.addEventListener('click',copySvg);
copyImgBtn.addEventListener('click',copyImg);
dlBtn.addEventListener('click',downloadImage);

// Tabでインデント、Ctrl+Enterで描画
latexInput.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=e.target.selectionStart,en=e.target.selectionEnd;e.target.setRangeText('  ',s,en,'end');}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();render();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(!dlBtn.disabled)downloadImage();}
});
window.addEventListener('error',e=>{errBox.textContent='JSエラー: '+e.message;errBox.style.display='block';});

/* ========= 初期化 ========= */
(async()=>{
  const savedMode=loadSettings();
  updateLabels();
  await loadKatexCss();
  if(!latexInput.value&&!formulaInput.value){
    // 初回は式+凡例の例を表示
    formulaInput.value=PRESETS[3].formula;legendInput.value=PRESETS[3].legend;
  }
  setMode(savedMode==='figure'||savedMode==='single'?savedMode:'figure');
  render();
})();
</script>
