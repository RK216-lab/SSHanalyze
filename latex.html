<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaTeX v4 - Taint修正</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root{--bg:#f5f5f7;--sf:#fff;--sf2:#fafafc;--ink:#111;--mut:#6e6e73;--acc:#0071e3;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);--r:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.04),0 8px 24px -6px rgba(0,0,0,.08);--sp:clamp(1rem,.8rem + .8vw,1.4rem)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
header{background:var(--sf);border-bottom:1px solid var(--line);padding:.9rem var(--sp);position:sticky;top:0;z-index:10}
.header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
h1{font-size:1.1rem;font-weight:600}
.sub{font-size:.78rem;color:var(--mut)}
main{max-width:1180px;margin:0 auto;padding:var(--sp);display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--sf);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:.9rem 1.1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.pt{font-size:.9rem;font-weight:600}
.pb{padding:1.1rem;flex:1;display:flex;flex-direction:column;gap:1rem}
label{font-size:.78rem;font-weight:500;color:var(--mut);display:block;margin-bottom:.28rem}
textarea,input,select{width:100%;font:inherit;font-size:.92rem;padding:.6rem .8rem;border:1px solid var(--line2);border-radius:var(--rs);background:var(--sf2);color:var(--ink);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
textarea{resize:vertical;min-height:88px;line-height:1.5}
.pw{flex:1;min-height:260px;border:2px dashed var(--line2);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;padding:1.2rem;position:relative;overflow:auto;background:#fff}
.pw.has{background:#fff repeating-conic-gradient(#f6f6f6 0 25%,#fff 0 50%) 0 / 20px 20px;border-style:solid;border-color:var(--line)}
#preview{max-width:100%}
.phold{color:var(--mut);font-size:.88rem;text-align:center}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.65rem}
.cg{display:flex;flex-direction:column;gap:.18rem}
.cg.inline{flex-direction:row;align-items:center;gap:.38rem}
.cg.inline label{margin:0;white-space:nowrap}
input[type=color]{width:100%;height:32px;border:1px solid var(--line2);border-radius:var(--rs);padding:2px}
input[type=range]{width:100%}
.rv{font-size:.74rem;color:var(--mut);text-align:right;min-width:3em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;padding:.48rem .85rem;font-size:.8rem;font-weight:500;border-radius:var(--rs);border:1px solid transparent;cursor:pointer}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-s{background:var(--sf);color:var(--ink);border-color:var(--line2)}
.br{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{font-size:.73rem;padding:.3rem .6rem;border-radius:999px;background:var(--sf2);border:1px solid var(--line);color:var(--mut);cursor:pointer}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(12px);background:#111;color:#fff;padding:.55rem .95rem;border-radius:8px;font-size:.8rem;opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#ff3b30}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;background:var(--sf2);border:1px solid var(--line);border-radius:8px;padding:.55rem;max-height:110px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--mut)}
.mode{display:flex;background:var(--sf2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;width:fit-content}
.mbtn{padding:.34rem .85rem;border-radius:999px;border:0;background:transparent;font-size:.8rem;font-weight:500;cursor:pointer;color:var(--mut)}
.mbtn.on{background:var(--sf);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--ink);border:1px solid var(--line)}
.figure-card{display:inline-block;text-align:left;line-height:1.2}
.legend-item{display:flex;align-items:baseline;gap:.4em;margin:.16em 0}
.div{height:1px;background:var(--line);margin:.15rem 0}
</style>
</head>
<body>
<header><div class="header-inner"><div><h1>LaTeX v4 <span style="font-weight:400;color:var(--mut);font-size:.75em">Taint修正・軽量</span></h1><div class="sub">上:式(大)/下:凡例(小) | 透過PNG | 余白トリム | SecurityError修正</div></div><div class="br"><span style="font-size:.7rem;color:var(--mut)" id="katexState">KaTeX読込中...</span></div></div></header>
<main>
<div class="panel">
  <div class="ph"><div class="pt">入力</div><div class="mode"><button class="mbtn on" data-mode="single">単一式</button><button class="mbtn" data-mode="figure">式+凡例</button></div></div>
  <div class="pb">
    <div id="singlePane">
      <div><label>LaTeX 数式</label><textarea id="latexInput">E = mc^2</textarea></div>
      <div style="margin-top:.6rem"><label>サンプル</label><div class="br"><span class="chip" data-latex="E = mc^2">E=mc²</span><span class="chip" data-latex="\text{Rate} = \frac{W_{\text{before}}-W_{\text{after}}}{W_{\text{before}}-W_{\text{base}}}\times 100\ (%)">Rate式</span></div></div>
    </div>
    <div id="figurePane" style="display:none">
      <div><label>上の式（大きく）LaTeX</label><textarea id="formulaInput" style="min-height:78px">\text{Rate} = \frac{W_{\text{before}} - W_{\text{after}}}{W_{\text{before}} - W_{\text{base}}} \times 100\ (%)</textarea></div>
      <div><label>下の凡例（1行1項目、コロン区切り）</label><textarea id="legendInput" style="min-height:108px">W_{\text{base}} : Base fabric weight
W_{\text{before}} : Weight before washing
W_{\text{after}} : Weight after washing</textarea></div>
      <div class="controls" style="margin-top:.15rem">
        <div class="cg"><label>式サイズ <span class="rv" id="fsVal">28px</span></label><input type="range" id="fs" min="16" max="52" step="1" value="28"></div>
        <div class="cg"><label>凡例サイズ <span class="rv" id="lsVal">13px</span></label><input type="range" id="ls" min="9" max="22" step="1" value="13"></div>
      </div>
    </div>
    <div class="div"></div>
    <div class="controls">
      <div class="cg"><label>文字色</label><input type="color" id="tc" value="#000000"></div>
      <div class="cg"><label>背景色</label><input type="color" id="bg" value="#ffffff"></div>
      <div class="cg inline" style="align-self:end"><input type="checkbox" id="tr" checked><label for="tr">背景透過</label></div>
      <div class="cg inline" style="align-self:end"><input type="checkbox" id="trim" checked><label for="trim">余白トリム</label></div>
      <div class="cg"><label>余白 <span class="rv" id="padVal">16px</span></label><input type="range" id="pad" min="0" max="48" step="2" value="16"></div>
      <div class="cg"><label>拡大率 <span class="rv" id="scVal">2.0</span></label><input type="range" id="sc" min="1" max="4" step="0.25" value="2"></div>
      <div class="cg"><label>DPI</label><input type="number" id="dpi" value="300" min="72" max="600" step="10"></div>
      <div class="cg"><label>形式</label><select id="fmt"><option value="png">PNG透過</option><option value="svg">SVG</option><option value="jpg">JPG</option></select></div>
    </div>
    <div class="br"><button class="btn btn-s" id="clearBtn">クリア</button><button class="btn btn-s" id="exBtn">画像の例をセット</button></div>
  </div>
</div>
<div class="panel">
  <div class="ph"><div class="pt">プレビュー <span id="status" style="font-weight:400;color:var(--mut);font-size:.76em;margin-left:.4em"></span></div><div class="br"><button class="btn btn-p" id="renderBtn">レンダリング</button></div></div>
  <div class="pb">
    <div class="pw" id="pw"><div class="phold" id="phold">レンダリングしてください</div><div id="preview" style="display:none"></div></div>
    <div class="br"><button class="btn btn-p" id="dlBtn">画像DL</button><button class="btn btn-s" id="copyImgBtn">画像コピー</button><button class="btn btn-s" id="copySvgBtn">SVGコード</button></div>
    <div id="svgWrap" style="display:none"><label>SVGコード</label><pre class="code" id="svgCode"></pre></div>
    <div id="errBox" style="display:none;background:#fff0f0;border:1px solid #ffcccc;color:#c00;padding:.6rem;border-radius:8px;font-size:.78rem;white-space:pre-wrap"></div>
  </div>
</div>
</main>
<div class="toast" id="toast"></div>
<script>
let lastSvgXml='',lastSvgBlobUrl=null,lastPngUrl=null,lastJpgUrl=null;
let katexCssFull='',katexCssLite='',mode='single',isRendering=false;
const $=id=>document.getElementById(id);
const latexInput=$('latexInput'),formulaInput=$('formulaInput'),legendInput=$('legendInput');
const preview=$('preview'),pw=$('pw'),phold=$('phold');
const toastEl=$('toast'),svgWrap=$('svgWrap'),svgCodeEl=$('svgCode'),errBox=$('errBox');
const tc=$('tc'),bg=$('bg'),tr=$('tr'),trim=$('trim'),pad=$('pad'),sc=$('sc'),dpi=$('dpi'),fmt=$('fmt');
const fs=$('fs'),ls=$('ls');
const statusEl=$('status'),katexState=$('katexState'),dlBtn=$('dlBtn'),renderBtn=$('renderBtn');
function toast(m,err){toastEl.textContent=m;toastEl.classList.toggle('err',!!err);toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),2400);}
function strip(s){const v=s.trim();if(v.startsWith('$$')&&v.endsWith('$$'))return v.slice(2,-2).trim();if(v.startsWith('$')&&v.endsWith('$'))return v.slice(1,-1).trim();return v;}
async function loadKatexCss(){
 try{
  const r=await fetch('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',{cache:'force-cache'});
  if(r.ok){
   let txt=await r.text();
   txt=txt.replace(/url\(["']?fonts\//g,"url('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/fonts/");
   katexCssFull=txt;
   katexCssLite=txt.replace(/@font-face\s*{[^}]*}/g,'');
   katexCssLite+=`.katex{font-family:"Times New Roman",Times,serif !important;}`;
  }
 }catch(e){console.warn(e);}
 katexState.textContent=typeof katex!=='undefined'?'KaTeX OK':'KaTeX未読込';
}
function setMode(m){
 mode=m;
 document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
 $('singlePane').style.display=m==='single'?'block':'none';
 $('figurePane').style.display=m==='figure'?'block':'none';
 render();
}
function parseLegend(txt){return txt.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{const mm=line.match(/^(.+?)\s*[:：]\s*(.+)$/);if(mm)return{sym:mm[1].trim(),desc:mm[2].trim()};return{sym:'',desc:line};});}
function renderKatex(tex,el,display){try{katex.render(strip(tex),el,{throwOnError:false,displayMode:!!display,trust:true,strict:false});return true;}catch(e){el.innerHTML='<span style="color:#ff3b30">'+tex+'</span>';return false;}}
async function render(){
 if(isRendering)return;
 if(typeof katex==='undefined'){katexState.textContent='KaTeX読込中...';setTimeout(render,120);return;}
 katexState.textContent='KaTeX OK';errBox.style.display='none';isRendering=true;renderBtn.disabled=true;statusEl.textContent='レンダリング中...';
 try{
  const textColor=tc.value;const bgColor=tr.checked?'transparent':bg.value;const padV=parseInt(pad.value,10)||0;
  preview.style.display='block';phold.style.display='none';pw.classList.add('has');
  preview.style.color=textColor;preview.style.background=bgColor;preview.style.padding=padV+'px';preview.innerHTML='';
  if(mode==='single'){
   const raw=latexInput.value.trim();if(!raw){preview.style.display='none';phold.style.display='block';pw.classList.remove('has');statusEl.textContent='';isRendering=false;renderBtn.disabled=false;return;}
   const inner=document.createElement('div');inner.style.display='inline-block';preview.appendChild(inner);renderKatex(raw,inner,true);
  }else{
   const fRaw=formulaInput.value.trim();const lRaw=legendInput.value.trim();
   if(!fRaw&&!lRaw){preview.style.display='none';phold.style.display='block';statusEl.textContent='';isRendering=false;renderBtn.disabled=false;return;}
   const card=document.createElement('div');card.className='figure-card';
   const fDiv=document.createElement('div');fDiv.className='figure-formula';fDiv.style.fontSize=fs.value+'px';fDiv.style.color=textColor;
   const fInner=document.createElement('div');fInner.style.display='inline-block';fDiv.appendChild(fInner);
   if(fRaw)renderKatex(fRaw,fInner,true);card.appendChild(fDiv);
   if(lRaw){
    const legDiv=document.createElement('div');legDiv.className='figure-legend';legDiv.style.fontSize=ls.value+'px';legDiv.style.color=textColor;
    parseLegend(lRaw).forEach(it=>{
     const row=document.createElement('div');row.className='legend-item';
     if(it.sym){const sym=document.createElement('span');if(/[_^\\{}]/.test(it.sym))renderKatex(it.sym,sym,false);else sym.textContent=it.sym;const col=document.createElement('span');col.textContent=' : ';col.style.opacity='.6';const desc=document.createElement('span');desc.textContent=it.desc;row.append(sym,col,desc);}else{row.textContent=it.desc;}
     legDiv.appendChild(row);
    });card.appendChild(legDiv);
   }
   preview.appendChild(card);
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  if(document.fonts?.ready){try{await document.fonts.ready;}catch(e){}}
  await generateOutputs();toast('レンダリング完了');
 }catch(e){console.error(e);errBox.textContent='エラー: '+(e.stack||e.message);errBox.style.display='block';toast('失敗: '+e.message,true);statusEl.textContent='失敗';}
 finally{isRendering=false;renderBtn.disabled=false;}
}
async function generateOutputs(){
 statusEl.textContent='画像生成中...';dlBtn.disabled=true;
 const w=Math.max(1,Math.ceil(preview.scrollWidth));const h=Math.max(1,Math.ceil(preview.scrollHeight));
 const textColor=tc.value;const bgColor=tr.checked?'transparent':bg.value;const padV=parseInt(pad.value,10)||0;
 const innerHtml=preview.innerHTML;
 const styleFull=katexCssFull||'';
 const svgDownload=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>${styleFull}.figure-card{display:inline-block;text-align:left}.figure-formula{line-height:1.28}.figure-legend{margin-top:.7em;line-height:1.55}.legend-item{display:flex;gap:.4em;align-items:baseline;margin:.16em 0}</style>${bgColor!=='transparent'?`<rect width="100%" height="100%" fill="${bgColor}"/>`:''}<foreignObject x="0" y="0" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="color:${textColor};padding:${padV}px;width:${w}px;height:${h}px;box-sizing:border-box;background:${bgColor};display:flex;align-items:center;justify-content:center"><div style="display:inline-block;max-width:100%">${innerHtml}</div></div></foreignObject></svg>`;
 const styleLite=katexCssLite||`.katex{font-family:"Times New Roman",Times,serif}`;
 const svgForPng=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>${styleLite}.figure-card{display:inline-block;text-align:left}.figure-formula{line-height:1.28}.figure-legend{margin-top:.7em;line-height:1.55}.legend-item{display:flex;gap:.4em;align-items:baseline;margin:.16em 0}</style>${bgColor!=='transparent'?`<rect width="100%" height="100%" fill="${bgColor}"/>`:''}<foreignObject x="0" y="0" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="color:${textColor};padding:${padV}px;width:${w}px;height:${h}px;box-sizing:border-box;background:${bgColor};display:flex;align-items:center;justify-content:center;font-family:'Times New Roman',Times,serif"><div style="display:inline-block;max-width:100%">${innerHtml}</div></div></foreignObject></svg>`;
 lastSvgXml=svgDownload;
 if(lastSvgBlobUrl)URL.revokeObjectURL(lastSvgBlobUrl);
 lastSvgBlobUrl=URL.createObjectURL(new Blob([svgDownload],{type:'image/svg+xml;charset=utf-8'}));
 svgCodeEl.textContent=svgDownload;svgWrap.style.display='block';
 try{
  const pngBlobUrl=URL.createObjectURL(new Blob([svgForPng],{type:'image/svg+xml;charset=utf-8'}));
  const res=await svgUrlToCanvas(pngBlobUrl,w,h,bgColor,parseFloat(sc.value),trim.checked);
  URL.revokeObjectURL(pngBlobUrl);
  lastPngUrl=res.png;lastJpgUrl=res.jpg;statusEl.textContent=`${w}x${h} → ${res.w}x${res.h} (PNG OK)`;
 }catch(e){console.error(e);lastPngUrl=null;lastJpgUrl=null;statusEl.textContent=`${w}x${h} (PNG失敗→SVG使用)`;errBox.textContent='PNG生成失敗: '+e.message+' → SVGはDL可能です。';errBox.style.display='block';}
 finally{dlBtn.disabled=false;}
}
function svgUrlToCanvas(url,w,h,bg,scale,doTrim){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   try{
    let cw=Math.max(1,Math.ceil(w*scale));let ch=Math.max(1,Math.ceil(h*scale));
    const canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    if(bg&&bg!=='transparent'){ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);}else ctx.clearRect(0,0,cw,ch);
    ctx.drawImage(img,0,0,cw,ch);
    let finalCanvas=canvas;if(doTrim){finalCanvas=trimCanvas(canvas);}
    const pngUrl=finalCanvas.toDataURL('image/png');
    let jpgUrl;if(bg==='transparent'){const c2=document.createElement('canvas');c2.width=finalCanvas.width;c2.height=finalCanvas.height;const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c2.width,c2.height);x.drawImage(finalCanvas,0,0);jpgUrl=c2.toDataURL('image/jpeg',0.92);}else{jpgUrl=finalCanvas.toDataURL('image/jpeg',0.92);}
    resolve({png:pngUrl,jpg:jpgUrl,w:finalCanvas.width,h:finalCanvas.height});
   }catch(e){reject(e);}
  };
  img.onerror=()=>reject(new Error('SVG画像の読み込み失敗'));
  img.src=url;
 });
}
function trimCanvas(canvas){
 const ctx=canvas.getContext('2d',{willReadFrequently:true});const w=canvas.width,h=canvas.height;let data;try{data=ctx.getImageData(0,0,w,h).data;}catch(e){return canvas;}
 let top=h,left=w,right=-1,bottom=-1;for(let y=0;y<h;y++){for(let x=0;x<w;x++){const i=(y*w+x)*4+3;if(data[i]>10){if(x<left)left=x;if(x>right)right=x;if(y<top)top=y;if(y>bottom)bottom=y;}}}
 if(right<0)return canvas;const p=2;left=Math.max(0,left-p);top=Math.max(0,top-p);right=Math.min(w-1,right+p);bottom=Math.min(h-1,bottom+p);const tw=right-left+1,th=bottom-top+1;if(tw===w&&th===h)return canvas;const out=document.createElement('canvas');out.width=tw;out.height=th;out.getContext('2d').drawImage(canvas,left,top,tw,th,0,0,tw,th);return out;
}
function ts(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');}
function downloadImage(){
 const f=fmt.value;if(f==='svg'){if(!lastSvgBlobUrl){toast('先にレンダリング',true);return;}const a=document.createElement('a');a.href=lastSvgBlobUrl;a.download='latex_'+ts()+'.svg';a.click();toast('SVG DL');return;}
 let url=f==='png'?lastPngUrl:lastJpgUrl;if(!url){if(lastSvgBlobUrl){toast('PNG失敗→SVGで代替DL',true);const a=document.createElement('a');a.href=lastSvgBlobUrl;a.download='latex_'+ts()+'.svg';a.click();return;}toast('先にレンダリング',true);return;}
 if(f==='png'){const d=parseInt($('dpi').value,10)||300;dlWithDpi(url,d,'latex_'+ts()+'.png');return;}
 const a=document.createElement('a');a.href=url;a.download='latex_'+ts()+'.'+f;a.click();toast(f.toUpperCase()+' DL');
}
function dlWithDpi(dataUrl,dpi,filename){
 try{
  const bin=atob(dataUrl.split(',')[1]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ppm=Math.round(dpi/0.0254);const pHYs=new Uint8Array(9);const dv=new DataView(pHYs.buffer);dv.setUint32(0,ppm,false);dv.setUint32(4,ppm,false);pHYs[8]=1;
  const crc=crc32(pHYs);const crcB=new Uint8Array(4);new DataView(crcB.buffer).setUint32(0,crc,false);
  const chunk=new Uint8Array(21);const dv2=new DataView(chunk.buffer);dv2.setUint32(0,9,false);chunk.set([0x70,0x48,0x59,0x73],4);chunk.set(pHYs,8);chunk.set(crcB,17);
  let pos=8;const ihdrLen=new DataView(bytes.buffer).getUint32(pos,false);pos+=4+4+ihdrLen+4;
  const before=bytes.slice(0,pos),after=bytes.slice(pos);
  const out=new Uint8Array(before.length+chunk.length+after.length);out.set(before,0);out.set(chunk,before.length);out.set(after,before.length+chunk.length);
  const blob=new Blob([out],{type:'image/png'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('PNG '+dpi+' DPI DL');
 }catch(e){const a=document.createElement('a');a.href=dataUrl;a.download=filename;a.click();}
}
function crc32(b){if(!crc32.table){crc32.table=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);crc32.table[i]=c;}}let crc=0xFFFFFFFF;for(let i=0;i<b.length;i++)crc=crc32.table[(crc^b[i])&0xFF]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;}
async function copySvg(){if(!lastSvgXml){toast('SVGなし',true);return;}try{await navigator.clipboard.writeText(lastSvgXml);toast('SVGコピー');}catch(e){toast('コピー失敗',true);}}
async function copyImg(){
 const f=fmt.value;if(f==='svg'){try{const b=new Blob([lastSvgXml],{type:'image/svg+xml'});await navigator.clipboard.write([new ClipboardItem({'image/svg+xml':b})]);toast('SVGコピー');return;}catch(e){if(lastPngUrl){try{const b=await (await fetch(lastPngUrl)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('PNGでコピー');return;}catch(e2){}}toast('コピー失敗',true);return;}}
 let url=f==='png'?lastPngUrl:lastJpgUrl;if(!url){toast('先にレンダリング',true);return;}
 try{const b=await (await fetch(url)).blob();await navigator.clipboard.write([new ClipboardItem({[b.type]:b})]);toast(f.toUpperCase()+'コピー');}catch(e){toast('コピー失敗: '+e.message,true);}
}
