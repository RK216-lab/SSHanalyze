<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Wash V3 OpenCV</title><script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js"></script><style>:root{--bg:#1e1e2e;--card:#292941;--card2:#343452;--text:#f1f3f9;--muted:#bac1d6;--blue:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--border:#555577}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,'Noto Sans JP',sans-serif}header{padding:22px 28px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:0}h2{font-size:20px;margin:0 0 16px}button,input,textarea{font:inherit}button{padding:11px 15px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-weight:700}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:#11111b}button.success{background:var(--green);color:#11111b}label{display:block;color:var(--muted);font-size:14px;margin-top:9px}input,textarea{width:100%;padding:10px;margin-top:4px;border:1px solid var(--border);border-radius:7px;background:#181825;color:var(--text)}.layout{max-width:1900px;margin:auto;padding:20px;display:grid;grid-template-columns:330px minmax(500px,1fr) 440px;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}.tabs,.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drop{margin-top:14px;padding:25px 12px;text-align:center;border:2px dashed var(--blue);border-radius:10px;cursor:pointer}.drop input{margin-top:12px}.hint{color:var(--muted);font-size:13px}.canvasbox{background:#11111b;border-radius:10px;min-height:450px;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvasbox canvas{max-width:100%;height:auto;touch-action:none}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.status{font-size:15px;color:var(--green);font-weight:700}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}.metric strong{color:var(--green);font-size:18px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 5px;border-bottom:1px solid var(--border);text-align:right}th:first-child,td:first-child{text-align:left}.hidden{display:none}@media(max-width:1250px){.layout{grid-template-columns:300px 1fr}.layout>section:nth-child(2){grid-column:2;grid-row:1}.layout>section:nth-child(3){grid-column:1/-1}}@media(max-width:800px){header{padding:16px;display:block}.layout{display:block;padding:10px}h1{font-size:23px}.canvasbox{min-height:300px}}
</style></head><body><header><div><h1>洗浄評価 <span style="color:var(--blue)">Lab-Wash V3</span></h1><div class="hint">OpenCV.js必須・研究用画像解析ツール</div></div><div id="status" class="status">OpenCV.js 読み込み中…</div></header><main class="layout"><section><div class="card"><h2>実験条件</h2><label>EXP-ID<input id="expId"></label><div class="grid2"><label>試料<input id="sample"></label><label>実施者<input id="operator"></label></div><label>洗浄条件<input id="condition"></label><div class="grid2"><label>温度<input id="temp"></label><label>時間<input id="time"></label></div><label>メモ<textarea id="memo" rows="3"></textarea></label></div><div class="card"><h2>画像入力</h2><div class="tabs"><button class="tab primary" data-tab="fabric">原布</button><button class="tab" data-tab="before">洗浄前</button><button class="tab" data-tab="after">洗浄後</button></div><div id="drop" class="drop">画像を選択 / ドロップ / Ctrl+V<input id="file" type="file" accept="image/*"></div><label>重量 (g)<input id="weight" type="number" step="0.001"></label><p class="hint">現在のタブが画像の貼り付け先になります。</p></div><div class="card"><h2>ROI・閾値</h2><label>ROI X<input id="rx" type="range" min="0" max=".8" step=".01" value=".2"></label><label>ROI Y<input id="ry" type="range" min="0" max=".8" step=".01" value=".2"></label><label>ROIサイズ<input id="rs" type="range" min=".05" max=".9" step=".01" value=".6"></label><label>汚れ判定 L*閾値<input id="threshold" type="number" min="0" max="100" value="45"></label><div class="toolbar"><button id="center">中央ROI</button><button id="max">最大ROI</button><button id="preset" class="success">設定JSON保存</button><button id="load">設定JSON読込</button><input id="presetFile" class="hidden" type="file" accept="application/json"></div></div></section><section><div class="card"><div class="toolbar" style="justify-content:space-between"><h2>ROIエディタ</h2><button id="analyze" class="primary">解析実行</button></div><div id="canvasbox" class="canvasbox"><canvas id="main"></canvas></div><p class="hint">ROI枠内をドラッグすると直接移動できます。</p></div><div class="card"><h2>比較画像</h2><div class="grid3"><div><b>原布</b><canvas id="cf"></canvas></div><div><b>洗浄前</b><canvas id="cb"></canvas></div><div><b>洗浄後</b><canvas id="ca"></canvas></div></div></div><div class="card"><h2>L*推移</h2><canvas id="chart"></canvas></div></section><section><div class="card"><h2>解析結果</h2><div id="results"><p class="hint">画像を読み込み、解析実行してください。</p></div></div><div class="card"><h2>出力</h2><div class="toolbar"><button id="csv" class="success">CSV保存</button><button id="copy">Excel用コピー</button><button id="json">JSON保存</button></div></div><div class="card"><h2>OpenCV.jsについて</h2><p class="hint">この版はOpenCV.jsが利用可能になるまで解析を実行できません。色変換、ROI処理、二値化、統計量の算出をOpenCV.jsで行います。</p></div></section></main><script>"use strict";const $=id=>document.getElementById(id),keys=['fabric','before','after'],names={fabric:'原布',before:'洗浄前',after:'洗浄後'};const st={tab:'fabric',images:{fabric:null,before:null,after:null},weights:{fabric:'',before:'',after:''},results:{}};let chart=null,drag=null;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function f(v){return Number.isFinite(v)?v.toFixed(2):'-'}function cvReady(){return window.cv&&cv.Mat&&cv.imread&&cv.cvtColor&&cv.meanStdDev&&cv.threshold}function waitCv(){if(cvReady()){$('status').textContent='● OpenCV.js Ready';return}setTimeout(waitCv,300)}waitCv();function imageFile(file){return new Promise((ok,no)=>{if(!file||!file.type.startsWith('image/'))return no(Error('画像ファイルを選択してください'));let u=URL.createObjectURL(file),im=new Image;im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(u);ok(c)};im.onerror=()=>no(Error('画像を読み込めません'));im.src=u})}async function setImage(file){try{st.images[st.tab]=await imageFile(file);draw();compare()}catch(e){alert(e.message)}}$('file').onchange=e=>setImage(e.target.files[0]);$('drop').onclick=e=>{if(e.target!==$('file'))$('file').click()};$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();setImage(e.dataTransfer.files[0])};document.addEventListener('paste',e=>{let x=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(x)setImage(x.getAsFile())});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.className=x===b?'tab primary':'tab');$('weight').value=st.weights[st.tab];draw()});$('weight').oninput=e=>st.weights[st.tab]=e.target.value;['rx','ry','rs','threshold'].forEach(id=>$(id).oninput=draw);$('center').onclick=()=>{$('rx').value=.25;$('ry').value=.25;$('rs').value=.5;draw()};$('max').onclick=()=>{$('rx').value=.05;$('ry').value=.05;$('rs').value=.9;draw()};function draw(){let c=$('main'),x=c.getContext('2d'),im=st.images[st.tab];if(!im){c.width=$('canvasbox').clientWidth;c.height=300;x.fillStyle='#11111b';x.fillRect(0,0,c.width,c.height);x.fillStyle='#bac1d6';x.font='16px system-ui';x.fillText('画像を入力してください',20,32);return}let w=$('canvasbox').clientWidth,h=w*im.height/im.width;c.width=w;c.height=h;x.drawImage(im,0,0,w,h);let rx=+$('rx').value,ry=+$('ry').value,s=+$('rs').value,px=rx*w,py=ry*h,ps=s*w;x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,w,h);x.clearRect(px,py,ps,ps);x.drawImage(im,rx*im.width,ry*im.height,s*im.width,s*im.height,px,py,ps,ps);x.strokeStyle='#89b4fa';x.lineWidth=4;x.strokeRect(px,py,ps,ps)}$('main').onpointerdown=e=>{let c=$('main'),r=c.getBoundingClientRect(),s=+$('rs').value,w=c.width,h=c.height,x=+$('rx').value*w,y=+$('ry').value*h,px=e.clientX-r.left,py=e.clientY-r.top;if(px>=x&&px<=x+s*w&&py>=y&&py<=y+s*h){drag={px,py,rx:+$('rx').value,ry:+$('ry').value};c.setPointerCapture(e.pointerId)}};$('main').onpointermove=e=>{if(!drag)return;let c=$('main'),r=c.getBoundingClientRect(),s=+$('rs').value;$('rx').value=clamp(drag.rx+(e.clientX-r.left-drag.px)/c.width,0,1-s);$('ry').value=clamp(drag.ry+(e.clientY-r.top-drag.py)/c.height,0,1-s);draw()};$('main').onpointerup=()=>drag=null;function compare(){keys.forEach(k=>{let c=$('c'+k[0]),im=st.images[k],x=c.getContext('2d');c.width=220;c.height=160;x.fillStyle='#11111b';x.fillRect(0,0,220,160);if(im)x.drawImage(im,0,0,220,160);else{x.fillStyle='#bac1d6';x.font='14px system-ui';x.fillText('未入力',12,25)}})}function analyze(k){if(!cvReady())throw Error('OpenCV.jsの読み込みが完了していません');let im=st.images[k],rx=+$('rx').value,ry=+$('ry').value,s=+$('rs').value;if(!im)return null;let c=document.createElement('canvas');c.width=Math.max(1,Math.floor(s*im.width));c.height=Math.max(1,Math.floor(s*im.height));c.getContext('2d').drawImage(im,rx*im.width,ry*im.height,s*im.width,s*im.height,0,0,c.width,c.height);let src=cv.imread(c),lab=new cv.Mat(),gray=new cv.Mat(),mean=new cv.Mat(),sd=new cv.Mat(),bin=new cv.Mat();try{cv.cvtColor(src,lab,cv.COLOR_RGBA2Lab);cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.meanStdDev(lab,mean,sd);let l=mean.doubleAt(0,0)*100/255,a=mean.doubleAt(1,0)-128,b=mean.doubleAt(2,0)-128;let threshold=+$('threshold').value*255/100,otsu=cv.threshold(gray,bin,threshold,255,cv.THRESH_BINARY_INV);let dark=cv.countNonZero(bin)/(gray.rows*gray.cols)*100;return{key:L=k,L:l,a,b,sd:sd.doubleAt(0,0)*100/255,dark,weight:+st.weights[k]||null}}finally{src.delete();lab.delete();gray.delete();mean.delete();sd.delete();bin.delete()}}function de(a,b){return a&&b?Math.sqrt((a.L-b.L)**2+(a.a-b.a)**2+(a.b-b.b)**2):null}function rate(v,b){return b?100*v/b:null}function run(){if(!cvReady())return alert('OpenCV.jsがまだ読み込まれていません');keys.forEach(k=>{if(st.images[k])st.results[k]=analyze(k)});let r=st.results,h='<table><tr><th>試料</th><th>L*</th><th>a*</th><th>b*</th><th>汚れ%</th><th>ΔE原布</th></tr>';keys.forEach(k=>{let q=r[k];if(q)h+=`<tr><td>${names[k]}</td><td>${f(q.L)}</td><td>${f(q.a)}</td><td>${f(q.b)}</td><td>${f(q.dark)}</td><td>${f(de(q,r.fabric))}</td></tr>`});h+='</table>';if(r.fabric&&r.before&&r.after){let lr=rate(r.after.L-r.before.L,r.fabric.L-r.before.L);h+=`<div class="metric"><span>L*洗浄率</span><strong>${f(lr)}%</strong></div><div class="metric"><span>ΔE*ab 前後</span><strong>${f(de(r.before,r.after))}</strong></div>`}$('results').innerHTML=h;compare();if(chart)chart.destroy();chart=new Chart($('chart'),{type:'line',data:{labels:['原布','洗浄前','洗浄後'],datasets:[{label:'L*',data:keys.map(k=>r[k]?.L??null),borderColor:'#89b4fa',backgroundColor:'#89b4fa44',fill:true}]},options:{scales:{y:{min:0,max:100}}}})}$('analyze').onclick=run;function rec(){return{meta:{expId:$('expId').value,sample:$('sample').value,operator:$('operator').value,condition:$('condition').value,temp:$('temp').value,time:$('time').value,memo:$('memo').value},roi:{x:+$('rx').value,y:+$('ry').value,size:+$('rs').value},threshold:+$('threshold').value,weights:st.weights,results:st.results}}function dl(n,t,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click()}$('json').onclick=()=>dl('wash-result.json',JSON.stringify(rec(),null,2),'application/json');$('csv').onclick=()=>{let r=rec(),h=['試料','L*','a*','b*','汚れ面積率','ΔE原布'],rows=keys.map(k=>{let q=r.results[k]||{};return[names[k],q.L??'',q.a??'',q.b??'',q.dark??'',de(q,r.results.fabric)??'']});dl('wash-result.csv','\ufeff'+[h,...rows].map(x=>x.join(',')).join('\n'),'text/csv')};$('copy').onclick=async()=>{let r=rec(),t=[['項目','原布','洗浄前','洗浄後'],['L*',...keys.map(k=>r.results[k]?.L??'')],['a*',...keys.map(k=>r.results[k]?.a??'')],['b*',...keys.map(k=>r.results[k]?.b??'')]].map(x=>x.join('\t')).join('\n');await navigator.clipboard.writeText(t);alert('コピーしました')};$('preset').onclick=()=>dl('Lab-Wash-preset.json',JSON.stringify({rx:+$('rx').value,ry:+$('ry').value,rs:+$('rs').value,threshold:+$('threshold').value},null,2),'application/json');$('load').onclick=()=>$('presetFile').click();$('presetFile').onchange=async e=>{let p=JSON.parse(await e.target.files[0].text());$('rx').value=p.rx??.2;$('ry').value=p.ry??.2;$('rs').value=p.rs??.6;$('threshold').value=p.threshold??45;draw()};window.addEventListener('resize',draw);window.addEventListener('load',()=>{draw();compare()})</script></body></html>
